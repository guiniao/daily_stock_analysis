# Fork 扩展：自动同步上游仓库更新
#
# 用途：本仓库是上游项目的 Fork，此工作流定时把上游 main 的更新合并进本 Fork 的
# custom 分支（承载折叠卡片等自定义改动的分支）。
#
# 为什么需要自定义分支而非直接合并到 main：
#   - main 保持与上游 1:1 镜像，便于 fast-forward、零冲突；
#   - custom 承载所有自定义改动，Actions 从 custom 跑；
#   - 上游更新时 custom <- main 的合并，只有改动重叠处（折叠卡片入口分支点）
#     可能冲突，其余自动合并。
#
# 配置：
#   1. Secret SYNC_UPSTREAM_URL：上游仓库 git URL（例如
#      https://github.com/原作者/daily_stock_analysis.git）。可留空，默认用
#      下方 env UPSTREAM_REPO_URL（需改成真实值）。
#   2. Secret SYNC_PAT：有 push 权限的 Personal Access Token（fork 推送回自己
#      仓库需要，且 GITHUB_TOKEN 推送的提交不会触发后续 workflow）。
#   3. 下方 env 的 UPSTREAM_BRANCH / TARGET_BRANCH 按需调整。
#
# 冲突处理：合并冲突时本任务会失败，GitHub 会发邮件通知。届时本地执行：
#   git fetch upstream && git checkout custom && git merge upstream/main
#   手动解决冲突后 git push origin custom
# 折叠卡片改动集中在 src/notification_sender/feishu_collapsible.py（新文件）和
# feishu_sender.py / notification.py 的小分支点，冲突面极小。

name: Sync Upstream

on:
  schedule:
    # 每天 UTC 01:17（约北京时间 09:17）检查一次上游更新
    - cron: '17 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # 上游仓库 git URL（也可用 Secret SYNC_UPSTREAM_URL 覆盖）
  UPSTREAM_REPO_URL: https://github.com/ZhuLinsen/daily_stock_analysis.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: custom

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          UPSTREAM_URL="${{ secrets.SYNC_UPSTREAM_URL || env.UPSTREAM_REPO_URL }}"
          echo "Adding upstream remote: $UPSTREAM_URL"
          git remote add upstream "$UPSTREAM_URL"

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream into ${{ env.TARGET_BRANCH }}
        id: merge
        run: |
          set +e
          git merge --no-ff "upstream/${UPSTREAM_BRANCH}" -m "chore: sync upstream ${UPSTREAM_BRANCH}"
          MERGE_EXIT=$?
          echo "merge_exit=$MERGE_EXIT" >> $GITHUB_OUTPUT
          exit $MERGE_EXIT

      - name: Report merge conflict
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          echo "::error::合并上游时出现冲突。请本地解决：git fetch upstream && git checkout ${TARGET_BRANCH} && git merge upstream/${UPSTREAM_BRANCH}"
          git diff --name-only --diff-filter=U || true

      - name: Push to fork
        if: success()
        run: git push origin "${TARGET_BRANCH}"
